services:
    hemmelig-affipay:
        image: ${HEMMELIG_IMAGE:-ghcr.io/vasilevich/hemmelig-secure:v7}
        container_name: hemmelig-affipay
        restart: unless-stopped
        env_file:
            - .env
        environment:
            DATABASE_URL: file:/app/database/hemmelig.db
            # Current verified live hostname is secret.affipay.co.
            # If DNS/proxy is intentionally moved to secret.affipay.io, update all
            # three URL values below together.
            BETTER_AUTH_URL: https://secret.affipay.co
            HEMMELIG_BASE_URL: https://secret.affipay.co
            HEMMELIG_TRUSTED_ORIGIN: https://secret.affipay.co
            NODE_ENV: production
            HEMMELIG_PORT: '3000'
            HEMMELIG_INSTANCE_NAME: Affipay Secrets
            HEMMELIG_INSTANCE_DESCRIPTION: Securely share one-time encrypted secrets with Affipay.
            HEMMELIG_META_TITLE: Affipay Secrets
            HEMMELIG_META_DESCRIPTION: Securely share one-time encrypted secrets with Affipay.
            HEMMELIG_ALLOW_REGISTRATION: 'false'
            HEMMELIG_ALLOW_PASSWORD_PROTECTION: 'true'
            HEMMELIG_ALLOW_IP_RESTRICTION: 'true'
            HEMMELIG_ALLOW_FILE_UPLOADS: 'true'
            HEMMELIG_ANALYTICS_ENABLED: 'true'
            HEMMELIG_ENABLE_RATE_LIMITING: 'true'
            HEMMELIG_MAX_SECRET_SIZE: '102400'
        ports:
            - '192.168.100.10:50972:3000'
        volumes:
            - hemmelig-affipay-data:/app/database
            - hemmelig-affipay-uploads:/app/uploads
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--no-verbose',
                    '--tries=1',
                    '--spider',
                    'http://localhost:3000/api/health/ready',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 15s

volumes:
    hemmelig-affipay-data:
        name: hemmelig-affipay-data
    hemmelig-affipay-uploads:
        name: hemmelig-affipay-uploads
