services:
    hemmelig:
        image: ${HEMMELIG_IMAGE:-ghcr.io/vasilevich/hemmelig-secure:v7}
        container_name: hemmelig
        restart: unless-stopped
        env_file:
            - .env
        environment:
            DATABASE_URL: file:/app/database/hemmelig.db
            BETTER_AUTH_URL: https://secret.amypay.io
            HEMMELIG_BASE_URL: https://secret.amypay.io
            HEMMELIG_TRUSTED_ORIGIN: https://secret.amypay.io
            NODE_ENV: production
            HEMMELIG_PORT: '3000'
            HEMMELIG_INSTANCE_NAME: AmyPay Secrets
            HEMMELIG_INSTANCE_DESCRIPTION: Securely share one-time encrypted secrets with AmyPay.
            HEMMELIG_META_TITLE: AmyPay Secrets
            HEMMELIG_META_DESCRIPTION: Securely share one-time encrypted secrets with AmyPay.
            HEMMELIG_ALLOW_REGISTRATION: 'false'
            HEMMELIG_ALLOW_PASSWORD_PROTECTION: 'true'
            HEMMELIG_ALLOW_IP_RESTRICTION: 'true'
            HEMMELIG_ALLOW_FILE_UPLOADS: 'true'
            HEMMELIG_ANALYTICS_ENABLED: 'true'
            HEMMELIG_ENABLE_RATE_LIMITING: 'true'
            # KB. Project bundles are one encrypted file uploaded through the existing
            # authenticated Hemmelig file route.
            HEMMELIG_MAX_SECRET_SIZE: '102400'
        ports:
            - '192.168.100.10:50971:3000'
        volumes:
            - hemmelig-data:/app/database
            - hemmelig-uploads:/app/uploads
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--no-verbose',
                    '--tries=1',
                    '--spider',
                    'http://localhost:3000/api/health/ready',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 15s

volumes:
    hemmelig-data:
        name: hemmelig-data
    hemmelig-uploads:
        name: hemmelig-uploads
