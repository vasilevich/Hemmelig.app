<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="referrer" content="no-referrer" />
        <title>Encrypted demo sandbox</title>
    </head>
    <body>
        <script>
            addEventListener(
                'message',
                (event) => {
                    if (event.source !== parent) return;
                    const data = event.data;
                    if (
                        !data ||
                        data.type !== 'hemmelig-site:load' ||
                        typeof data.html !== 'string'
                    ) {
                        return;
                    }
                    document.open();
                    document.write(data.html);
                    document.close();
                },
                { once: true }
            );
        </script>
    </body>
</html>
